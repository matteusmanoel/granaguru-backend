# Configurações para ambiente de produção - VMs
spring.application.name=granaguru

# Configuração do banco MariaDB usando DNS
spring.datasource.url=jdbc:mariadb://db.granaguru.local:3306/granagurudb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=granaguru_user
spring.datasource.password=granaguru_r00t
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configurações de pool de conexão para produção
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA/Hibernate para produção
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configurações de servidor para produção
server.port=8080
server.address=0.0.0.0

# Logging para produção
logging.level.root=INFO
logging.level.app=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Configurações de segurança JWT
jwt.secret=granaguru_jwt_secret_key_2024_production_environment_secure
jwt.expiration=86400000

# Configurações de CORS para aceitar requisições do frontend
spring.web.cors.allowed-origins=http://granaguru.local,https://granaguru.local,http://www.granaguru.local,https://www.granaguru.local,http://192.168.56.10,http://frontend,http://api.granaguru.local:8080
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
spring.web.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
spring.web.cors.exposed-headers=Access-Control-Allow-Origin,Access-Control-Allow-Credentials,Authorization
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Configurações de gerenciamento
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always