# Configurações para ambiente de desenvolvimento
spring.application.name=granaguru

# Configuração do banco MySQL local para desenvolvimento
spring.datasource.url=jdbc:mysql://localhost:3306/granagurudb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate para desenvolvimento
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações de servidor para desenvolvimento
server.port=8080
server.address=0.0.0.0

# Logging para desenvolvimento
logging.level.root=INFO
logging.level.app=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configurações de segurança JWT para desenvolvimento
jwt.secret=granaguru_jwt_secret_key_2024_development_environment
jwt.expiration=86400000

# Configurações de CORS para desenvolvimento (aceita qualquer origem)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Profile ativo
spring.profiles.active=dev